name: chayitong-backend-v2

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chayitong
      MYSQL_USER: chayitong
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-verysecret}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./chayitong-backend/sql/bootstrap/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./chayitong-backend/sql/bootstrap/init_data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
      - ./chayitong-backend/sql/bootstrap/content_seeds.sql:/docker-entrypoint-initdb.d/03-content-seeds.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_PASSWORD} mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    profiles: [backend]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:mysql://mysql:3306/chayitong?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: chayitong
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:-secret}
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID:-}
      WECHAT_MINIAPP_APP_SECRET: ${WECHAT_MINIAPP_APP_SECRET:-}
      WECHAT_MINIAPP_LOGIN_URL: ${WECHAT_MINIAPP_LOGIN_URL:-https://api.weixin.qq.com/sns/jscode2session}
      APP_MEDIA_STORAGE: ${APP_MEDIA_STORAGE:-local}
      APP_MEDIA_LOCAL_ROOT: /data/media
      APP_MEDIA_PUBLIC_BASE_URL: ${APP_MEDIA_PUBLIC_BASE_URL:-http://localhost:8080/api/media}
      APP_MEDIA_S3_ENDPOINT: ${APP_MEDIA_S3_ENDPOINT:-}
      APP_MEDIA_S3_REGION: ${APP_MEDIA_S3_REGION:-us-east-1}
      APP_MEDIA_S3_BUCKET: ${APP_MEDIA_S3_BUCKET:-}
      APP_MEDIA_S3_ACCESS_KEY: ${APP_MEDIA_S3_ACCESS_KEY:-}
      APP_MEDIA_S3_SECRET_KEY: ${APP_MEDIA_S3_SECRET_KEY:-}
      APP_COS_SECRET_ID: ${APP_COS_SECRET_ID:-}
      APP_COS_SECRET_KEY: ${APP_COS_SECRET_KEY:-}
      APP_COS_REGION: ${APP_COS_REGION:-ap-beijing}
      APP_COS_BUCKET: ${APP_COS_BUCKET:-}
      APP_COS_PREFIX: ${APP_COS_PREFIX:-picgo/}
      APP_SHOP_QUOTE_SECRET: ${APP_SHOP_QUOTE_SECRET:-chayitong-local-quote-secret-change-me}
      APP_SHOP_DEMO_PAYMENT_ENABLED: ${APP_SHOP_DEMO_PAYMENT_ENABLED:-false}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    volumes:
      - media-data:/data/media

volumes:
  mysql-data:
  media-data:
