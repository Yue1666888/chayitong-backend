spring:
  application:
    name: chayitong-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  sql:
    init:
      mode: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:20MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:21MB}
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  token:
    access-ttl-seconds: ${APP_TOKEN_ACCESS_TTL:7200}
    refresh-ttl-seconds: ${APP_TOKEN_REFRESH_TTL:2592000}
  wechat:
    app-id: ${WECHAT_MINIAPP_APP_ID:}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
    login-url: ${WECHAT_MINIAPP_LOGIN_URL:https://api.weixin.qq.com/sns/jscode2session}
  media:
    storage: ${APP_MEDIA_STORAGE:local}
    local-root: ${APP_MEDIA_LOCAL_ROOT:./data/media}
    public-base-url: ${APP_MEDIA_PUBLIC_BASE_URL:http://localhost:8080/api/media}
    s3:
      endpoint: ${APP_MEDIA_S3_ENDPOINT:}
      region: ${APP_MEDIA_S3_REGION:us-east-1}
      bucket: ${APP_MEDIA_S3_BUCKET:}
      access-key: ${APP_MEDIA_S3_ACCESS_KEY:}
      secret-key: ${APP_MEDIA_S3_SECRET_KEY:}
    cos:
      secret-id: ${APP_COS_SECRET_ID:}
      secret-key: ${APP_COS_SECRET_KEY:}
      region: ${APP_COS_REGION:ap-beijing}
      bucket: ${APP_COS_BUCKET:}
      prefix: ${APP_COS_PREFIX:picgo/}
  shop:
    demo-payment-enabled: ${APP_SHOP_DEMO_PAYMENT_ENABLED:false}
    quote-ttl-seconds: ${APP_SHOP_QUOTE_TTL:300}
    payment-ttl-seconds: ${APP_SHOP_PAYMENT_TTL:1800}
    quote-secret: ${APP_SHOP_QUOTE_SECRET:chayitong-local-quote-secret-change-me}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{X-Trace-Id:-}] %logger{36} - %msg%n"
