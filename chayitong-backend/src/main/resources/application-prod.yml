spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  media:
    storage: ${APP_MEDIA_STORAGE:cos}
  shop:
    demo-payment-enabled: false
    quote-secret: ${APP_SHOP_QUOTE_SECRET}

logging:
  level:
    root: info
    com.chayitong: info
