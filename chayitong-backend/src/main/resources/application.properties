# 从本机 .env 读取密码，兼容从 Maven 目录或外层仓库启动。
spring.config.import=optional:file:./.env[.properties],optional:file:./chayitong-backend/.env[.properties]
spring.application.name=chayitong-backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3309/chayitong
spring.datasource.username=chayitong
spring.datasource.password=${MYSQL_APP_PASSWORD}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 与 compose.storage.yaml 中的本机练习配置对应。
app.storage.endpoint=${STORAGE_ENDPOINT:http://127.0.0.1:8333}
app.storage.bucket=${STORAGE_BUCKET:chayitong-practice}
app.storage.access-key=${STORAGE_ACCESS_KEY:chayitong-local}
app.storage.secret-key=${STORAGE_SECRET_KEY:chayitong-local-practice}
