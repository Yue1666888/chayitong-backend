# 从本机 .env 读取密码，兼容从 Maven 目录或外层仓库启动。
spring.config.import=optional:file:./.env[.properties],optional:file:./chayitong-backend/.env[.properties]
spring.application.name=chayitong-backend

spring.datasource.url=jdbc:mysql://127.0.0.1:3309/chayitong
spring.datasource.username=chayitong
spring.datasource.password=${MYSQL_APP_PASSWORD}
mybatis-plus.mapper-locations=classpath:mapper/*.xml
